name: beauty-admin

services:
  traefik:
    # v3.5+ ships a Docker client that negotiates API >= 1.40 (required by Engine 29+)
    image: traefik:v3.5
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ../traefik/traefik.admin.yml:/etc/traefik/traefik.yml:ro
      - ../traefik/dynamic:/etc/traefik/dynamic:ro
      - traefik_letsencrypt:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - admin_net
    environment:
      DOCKER_API_VERSION: '1.44'
    labels:
      - traefik.enable=false

  admin-web:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/admin-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    networks:
      - admin_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=beauty-admin_admin_net
      - traefik.http.routers.admin-web.rule=Host(`beautyadm.loomixx.ru`) && !PathPrefix(`/api`) && !PathPrefix(`/grafana`) && !PathPrefix(`/prometheus`)
      - traefik.http.routers.admin-web.entrypoints=websecure
      - traefik.http.routers.admin-web.tls.certresolver=letsencrypt
      - traefik.http.routers.admin-web.middlewares=security-headers@file,csp-admin@file,admin-allowlist@file,admin-ratelimit@file,compress@file
      - traefik.http.services.admin-web.loadbalancer.server.port=80
      - traefik.http.routers.admin-web.priority=1

  admin-api:
    image: ${REGISTRY}/${IMAGE_NAMESPACE}/api:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      # Selects InternalModule: staff guards, staff tables, staff cookies only
      API_CONTOUR: internal
      NODE_ENV: ${NODE_ENV:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      API_PORT: ${API_PORT:-3001}
      API_HOST: ${API_HOST:-0.0.0.0}
      TRUSTED_PROXY_HOPS: ${TRUSTED_PROXY_HOPS:-1}
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL}
      REDIS_QUEUE_URL: ${REDIS_QUEUE_URL}
      STAFF_JWT_SECRET: ${STAFF_JWT_SECRET}
      STAFF_SESSION_TTL_SEC: ${STAFF_SESSION_TTL_SEC:-28800}
      STAFF_COOKIE_NAME: ${STAFF_COOKIE_NAME:-beauty_staff_session}
      STAFF_COOKIE_SECURE: ${STAFF_COOKIE_SECURE:-true}
      STAFF_COOKIE_DOMAIN: ${STAFF_COOKIE_DOMAIN:-beautyadm.loomixx.ru}
      STAFF_TOTP_MAX_ATTEMPTS: ${STAFF_TOTP_MAX_ATTEMPTS:-5}
      STAFF_LOCKOUT_SEC: ${STAFF_LOCKOUT_SEC:-900}
      TOTP_ENCRYPTION_KEY: ${TOTP_ENCRYPTION_KEY}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}
      JWT_ACCESS_PRIVATE_KEY: ${JWT_ACCESS_PRIVATE_KEY}
      JWT_ACCESS_PUBLIC_KEY: ${JWT_ACCESS_PUBLIC_KEY}
      PUBLIC_MINIAPP_URL: ${PUBLIC_MINIAPP_URL:-https://beauty.loomixx.ru}
      PUBLIC_ADMIN_URL: ${PUBLIC_ADMIN_URL:-https://beautyadm.loomixx.ru}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-https://beauty.loomixx.ru/api/v1}
      INTERNAL_API_URL: ${INTERNAL_API_URL:-https://beautyadm.loomixx.ru/api/v1}
      CORS_ADMIN_ORIGINS: ${CORS_ADMIN_ORIGINS:-https://beautyadm.loomixx.ru}
      CORS_MINIAPP_ORIGINS: ${CORS_MINIAPP_ORIGINS:-https://beauty.loomixx.ru}
      CENTRIFUGO_API_URL: ${CENTRIFUGO_API_URL:-http://10.8.0.1:8000/api}
      CENTRIFUGO_API_KEY: ${CENTRIFUGO_API_KEY}
      CENTRIFUGO_TOKEN_SECRET: ${CENTRIFUGO_TOKEN_SECRET}
      BACKUP_TRIGGER_URL: ${BACKUP_TRIGGER_URL:-}
      BACKUP_TRIGGER_TOKEN: ${BACKUP_TRIGGER_TOKEN:-}
      RESTART_TRIGGER_URL: ${RESTART_TRIGGER_URL:-}
      RESTART_TRIGGER_TOKEN: ${RESTART_TRIGGER_TOKEN:-}
      PROMETHEUS_URL: ${PROMETHEUS_URL:-http://prometheus:9090}
      METRICS_TOKEN: ${METRICS_TOKEN}
      SENTRY_DSN: ${SENTRY_DSN_ADMIN_API:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
    networks:
      - admin_net
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    labels:
      - traefik.enable=true
      - traefik.docker.network=beauty-admin_admin_net
      # Staff API is served under /api on the admin host, matching the Nest global
      # prefix (/api/v1) and what apps/admin-web calls.
      - traefik.http.routers.admin-api.rule=Host(`beautyadm.loomixx.ru`) && PathPrefix(`/api`)
      - traefik.http.routers.admin-api.entrypoints=websecure
      - traefik.http.routers.admin-api.tls.certresolver=letsencrypt
      - traefik.http.routers.admin-api.middlewares=security-headers@file,admin-allowlist@file,admin-ratelimit@file,compress@file
      - traefik.http.services.admin-api.loadbalancer.server.port=${API_PORT:-3001}
      - traefik.http.routers.admin-api.priority=20

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --web.enable-lifecycle
    volumes:
      - ../observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - admin_net
    labels:
      - traefik.enable=true
      - traefik.docker.network=beauty-admin_admin_net
      - traefik.http.routers.prometheus.rule=Host(`beautyadm.loomixx.ru`) && PathPrefix(`/prometheus`)
      - traefik.http.routers.prometheus.entrypoints=websecure
      - traefik.http.routers.prometheus.tls.certresolver=letsencrypt
      - traefik.http.routers.prometheus.middlewares=security-headers@file,admin-allowlist@file,admin-ratelimit@file,prometheus-stripprefix@file
      - traefik.http.services.prometheus.loadbalancer.server.port=9090
      - traefik.http.routers.prometheus.priority=30

  grafana:
    image: grafana/grafana:11.4.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://beautyadm.loomixx.ru/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: 'true'
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
      GF_AUTH_ANONYMOUS_ENABLED: 'false'
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    networks:
      - admin_net
    depends_on:
      - prometheus
      - loki
    labels:
      - traefik.enable=true
      - traefik.docker.network=beauty-admin_admin_net
      - traefik.http.routers.grafana.rule=Host(`beautyadm.loomixx.ru`) && PathPrefix(`/grafana`)
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - traefik.http.routers.grafana.middlewares=security-headers@file,admin-allowlist@file,admin-ratelimit@file
      - traefik.http.services.grafana.loadbalancer.server.port=3000
      - traefik.http.routers.grafana.priority=30

  loki:
    image: grafana/loki:3.3.2
    restart: unless-stopped
    command: ['-config.file=/etc/loki/loki.yml']
    volumes:
      - ../observability/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks:
      - admin_net

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.117.0
    restart: unless-stopped
    command: ['--config=/etc/otelcol/config.yml']
    volumes:
      - ../observability/otel/otel-collector.yml:/etc/otelcol/config.yml:ro
    # OTLP reachable from app/data VMs over WireGuard
    ports:
      - '10.8.0.3:4317:4317'
      - '10.8.0.3:4318:4318'
    networks:
      - admin_net
    depends_on:
      - prometheus
      - loki

networks:
  admin_net:
    name: beauty-admin_admin_net
    driver: bridge

volumes:
  traefik_letsencrypt:
  prometheus_data:
  grafana_data:
  loki_data:
