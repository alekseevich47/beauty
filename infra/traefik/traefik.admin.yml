# Traefik static config — Admin VM (beautyadm.loomixx.ru)
# Routing is file-based (dynamic/routers-admin.yml). Docker provider is disabled:
# Docker Engine 29+ rejects the API version Traefik's bundled client still sends.
api:
  dashboard: false

entryPoints:
  web:
    address: ':80'
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ':443'
    http:
      tls:
        certResolver: letsencrypt
      middlewares:
        - security-headers@file
        - admin-allowlist@file

providers:
  file:
    directory: /etc/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      email: ops@loomixx.ru
      storage: /letsencrypt/acme.json
      httpChallenge:
        entryPoint: web

log:
  level: INFO

accessLog: {}

metrics:
  prometheus:
    entryPoint: websecure
    addEntryPointsLabels: true
    addServicesLabels: true
